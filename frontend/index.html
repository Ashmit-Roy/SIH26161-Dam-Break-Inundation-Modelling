<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIH26161 Dam Break Inundation Modelling Dashboard</title>
    <link rel="icon" href="/vite.svg" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      #root {
        max-width: 1400px;
        margin: 0 auto;
        padding: 2rem;
        font-family: Arial, Helvetica, sans-serif;
      }
      .header {
        background: #1a1a2e;
        color: #e94560;
        padding: 1.5rem 2rem;
        border-radius: 8px;
        margin-bottom: 2rem;
        text-align: center;
      }
      .header h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
      .header p { font-size: 0.9rem; opacity: 0.8; }
      .container {
        display: grid;
        grid-template-columns: 1fr 280px;
        gap: 2rem;
        max-width: 1600px;
        margin: 0 auto;
      }
      @media (max-width: 768px) {
        .container {
          grid-template-columns: 1fr;
        }
      }
      .app { min-height: 100vh; }
      .control-panel { padding: 1rem; }
      .setup-form { display: grid; gap: 1rem; margin-bottom: 1rem; }
      .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; align-items: center; }
      .form-row label { margin-bottom: 0; }
      .btn-primary {
        background: #e94560;
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 1rem;
      }
      .btn-primary:disabled { background: #666; cursor: not-allowed; }
      .scenarios-list { display: grid; gap: 0.5rem; margin-top: 0.5rem; }
      .scenario-btn {
        background: #fff;
        border: 1px solid #e94560;
        color: #e94560;
        padding: 0.5rem 1rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.85rem;
        width: 100%;
      }
      .scenario-btn:hover { background: #ffe; }
      .error-bar { background: #fee2e2; color: #e94560; padding: 0.75rem; border-radius: 4px; margin-top: 1rem; text-align: center; }
      .flood-map-card { height: 400px; width: 100%; background: #fafafa; padding: 1rem; }
      .map-container { height: 100%; width: 100%; }
      .statistics-card { padding: 1rem; }
      .stat-box { background: #fff; padding: 1rem; border-radius: 4px; margin-bottom: 1rem; }
      .comparison-box { background: #fff; padding: 1rem; border-radius: 4px; margin-bottom: 1rem; }
      .dashboard-state { background: #fff; padding: 1rem; border-radius: 4px; }
      .toggle-btn {
        width: 100%;
        margin-top: 0.5rem;
        padding: 0.5rem;
        background: #e94560;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.85rem;
      }
      .sidebar { display: flex; flex-direction: column; gap: 1.5rem; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
