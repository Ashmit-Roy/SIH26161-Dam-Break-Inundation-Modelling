[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sih26161-dam-break-inundation-modelling"
version = "0.1.0"
description = "Dam-break inundation modelling system for flood-risk assessment (SIH26161, Smart India Hackathon 2026)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

dependencies = [
    "numpy",
    "pandas",
    "rasterio",
    "geopandas",
    "shapely",
    "earthengine-api",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501 handled by formatter where possible; do not enable rules silently.
ignore = []

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
